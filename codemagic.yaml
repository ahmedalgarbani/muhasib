workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    max_build_duration: 120

    environment:
      xcode: latest
      flutter: 3.44.2

    scripts:
      - name: Install CocoaPods
        script: |
          sudo gem install cocoapods --no-document
          pod repo update 

      - name: Install Flutter dependencies
        script: flutter pub get

      # - name: Add Swift files to Xcode project
      #   script: |
      #     cd ios
      #     gem install xcodeproj --no-document

      #     ruby -e "
      #     require 'xcodeproj'

      #     project = Xcodeproj::Project.open('Runner.xcodeproj')
      #     target = project.targets.find { |t| t.name == 'Runner' }
      #     group = project.main_group['Runner']

      #     [
      #       'NativeTabBar.swift',
      #       'NativePlusButton.swift',
      #       'NativeGlassCard.swift',
      #       'NativeGlassListCard.swift',
      #       'NativeSheetBackground.swift',
      #       'SessionZoomTransition.swift'
      #     ].each do |filename|
      #       file_ref = group.new_file(filename)
      #       target.source_build_phase.add_file_reference(file_ref)
      #     end

      #     project.save
      #     "

      - name: Build iOS
        script: |
          flutter build ios --no-codesign

          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/Runner.app

          zip -r "$CM_BUILD_DIR/app.ipa" Payload

    artifacts:
      - app.ipa
      - "*.ipa"